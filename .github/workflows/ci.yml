name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      SENSITIVE_AUTH_HMAC_SECRET: ci_only_placeholder_with_32_characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --level error
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run functions:check
      - run: npm run verify:migrations
      - run: npm run build
      - run: npm run build:cloudflare
